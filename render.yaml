services:
  - type: web
    name: lol-bet-tracker-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_API_KEY
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
